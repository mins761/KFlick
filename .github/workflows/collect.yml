name: KFlick Collector

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum new items to try in this run'
        required: false
        default: '12'
      delay_seconds:
        description: 'Delay between OpenRouter requests'
        required: false
        default: '15'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase python-dotenv
      - run: python scripts/collect.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openrouter/free' }}
          MAX_ITEMS_PER_RUN: ${{ github.event.inputs.max_items || secrets.MAX_ITEMS_PER_RUN || '4' }}
          OPENROUTER_DELAY_SECONDS: ${{ github.event.inputs.delay_seconds || secrets.OPENROUTER_DELAY_SECONDS || '15' }}
          OPENROUTER_MAX_RETRIES: ${{ secrets.OPENROUTER_MAX_RETRIES || '3' }}
